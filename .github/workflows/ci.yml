name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # The e2e web server ran `npm run build`, so dist/ is ready for the load budget gate.
      - run: npm run check:budget
      - name: Check for narration script tests
        id: narration
        run: |
          if [ -f scripts/test_generate_narration.py ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.narration.outputs.exists == 'true'
        with:
          python-version: '3.14'
      - name: Python narration tests
        if: steps.narration.outputs.exists == 'true'
        run: |
          pip install -r scripts/requirements.txt
          python -m unittest scripts/test_generate_narration.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
